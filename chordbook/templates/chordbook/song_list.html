{% extends 'chordbook/base.html' %}

{% block title %}Songs - Chordbook{% endblock %}

{% block content %}
<h1>Songs</h1>
<ul class="list-group mt-3">
    {% for song in songs %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'song-detail' song.pk %}?from=songs">{{ song.title }}</a>
        <span class="badge bg-primary rounded-pill">{{ song.artist.name }}</span>
    </li>
    {% empty %}
    <li class="list-group-item">No songs found. <a href="{% url 'song-add' %}">Add one!</a></li>
    {% endfor %}
</ul>
{% endblock %}
