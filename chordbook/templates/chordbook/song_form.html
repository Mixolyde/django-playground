{% extends 'chordbook/base.html' %}

{% block title %}{% if form.instance.pk %}Edit{% else %}Add{% endif %} Song{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Song</h1>
<form method="post" class="mt-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Song</button>
    <a href="{% url 'song-list' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
